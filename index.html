<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Suporte Inteligente | Bancas & Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: #2d3a4f;
      --text: #e8eef7;
      --text-muted: #8b9bb4;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #22c55e;
      --danger: #ef4444;
      --bot-bubble: #1e293b;
      --user-bubble: #1d4ed8;
      --radius: 16px;
      --header-h: 64px;
      --input-h: 72px;
      --theme-color: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.5s ease;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ===== TEMAS POR PLATAFORMA ===== */
    body.theme-acertos {
      --bg: #1a120a;
      --surface: #2a1c10;
      --surface-2: #3d2a18;
      --border: #5c4030;
      --bot-bubble: #2a1c10;
      --user-bubble: #e67e22;
      --primary: #e67e22;
      --primary-hover: #d35400;
      --theme-color: #e67e22;
    }

    body.theme-feiticeira {
      --bg: #120a1a;
      --surface: #1c1030;
      --surface-2: #2a1848;
      --border: #4a3080;
      --bot-bubble: #1c1030;
      --user-bubble: #9b59b6;
      --primary: #9b59b6;
      --primary-hover: #8e44ad;
      --theme-color: #9b59b6;
    }

    body.theme-brasileira {
      --bg: #0a1a0f;
      --surface: #102a18;
      --surface-2: #183d28;
      --border: #2d5c40;
      --bot-bubble: #102a18;
      --user-bubble: #27ae60;
      --primary: #27ae60;
      --primary-hover: #1e8449;
      --theme-color: #27ae60;
    }

    body.theme-tiger {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-2: #2c2c2c;
      --border: #444;
      --bot-bubble: #1e1e1e;
      --user-bubble: #7f8c8d;
      --primary: #95a5a6;
      --primary-hover: #7f8c8d;
      --theme-color: #95a5a6;
    }

    body.theme-superacertos {
      --bg: #0a1220;
      --surface: #0f1c30;
      --surface-2: #183050;
      --border: #2a4a70;
      --bot-bubble: #0f1c30;
      --user-bubble: #2980b9;
      --primary: #3498db;
      --primary-hover: #2980b9;
      --theme-color: #3498db;
    }

    body.theme-superbancas {
      --bg: #050505;
      --surface: #111;
      --surface-2: #1a1a1a;
      --border: #333;
      --bot-bubble: #111;
      --user-bubble: #222;
      --primary: #555;
      --primary-hover: #444;
      --theme-color: #888;
    }

    /* ===== HEADER ===== */
    .header {
      height: var(--header-h);
      min-height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    .header-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--theme-color));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      transition: background 0.5s ease;
    }

    .header-info { flex: 1; min-width: 0; }
    .header-info h1 {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .reset-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .reset-btn:hover { color: var(--text); border-color: var(--text-muted); }

    /* ===== MAIN ===== */
    .chat-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #3d4f6a transparent;
    }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #3d4f6a; border-radius: 4px; }
    .messages::-webkit-scrollbar-thumb:hover { background: #526680; }

    .message {
      display: flex;
      gap: 10px;
      max-width: 90%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .message.bot .avatar {
      background: linear-gradient(135deg, var(--primary), var(--theme-color));
      transition: background 0.5s ease;
    }
    .message.user .avatar { background: var(--surface-2); }

    .bubble {
      padding: 11px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border-top-right-radius: 4px;
      color: #fff;
    }

    .bubble strong { color: #93c5fd; }
    body.theme-acertos .bubble strong { color: #f5b041; }
    body.theme-feiticeira .bubble strong { color: #d2b4de; }
    body.theme-brasileira .bubble strong { color: #82e0aa; }
    body.theme-tiger .bubble strong { color: #bdc3c7; }
    body.theme-superacertos .bubble strong { color: #85c1e9; }
    body.theme-superbancas .bubble strong { color: #aaa; }

    .message.user .bubble strong { color: #fff; opacity: 0.9; }
    .bubble ul, .bubble ol { margin: 8px 0 4px 18px; }
    .bubble li { margin-bottom: 4px; }

    .time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      padding-left: 2px;
    }
    .message.user .time { text-align: right; padding-right: 2px; }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .quick-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .quick-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-1px);
      color: #fff;
    }
    .quick-btn.confirm { border-color: var(--accent); color: #86efac; }
    .quick-btn.confirm:hover { background: #166534; border-color: #166534; color: #fff; }
    .quick-btn.deny { border-color: var(--danger); color: #fca5a5; }
    .quick-btn.deny:hover { background: #991b1b; border-color: #991b1b; color: #fff; }

    .typing {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-top-left-radius: 4px;
      width: fit-content;
    }
    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Transferindo animation */
    .transfer-msg {
      text-align: center;
      padding: 16px;
      color: var(--theme-color);
      font-weight: 500;
      font-size: 14px;
      animation: fadeIn 0.4s ease;
    }
    .transfer-msg .dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }
    .transfer-msg .dots span:nth-child(1) { animation-delay: 0s; }
    .transfer-msg .dots span:nth-child(2) { animation-delay: 0.2s; }
    .transfer-msg .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .input-area {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      min-height: var(--input-h);
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    .input-wrapper {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      transition: border-color 0.2s, background 0.4s ease;
      min-height: 44px;
    }
    .input-wrapper:focus-within { border-color: var(--primary); }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      min-height: 22px;
    }
    #userInput::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 44px;
      height: 44px;
      background: var(--primary);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, transform 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 600px) {
      .message { max-width: 94%; }
      .header { padding: 0 12px; }
      .messages { padding: 12px 10px 16px; }
      .input-area { padding: 10px 10px; }
    }
  </style>
</head>

O bônus vale apenas nas **primeiras recargas do dia**.`,
          cotacao: `**Cotações do Tiger Club (por R$ 1,00 apostado):**
• **Milhar**: R$ 8.000,00
• **Centena**: R$ 800,00
• **Dezena**: R$ 80,00
• **Grupo**: R$ 20,00
• **Unidade**: R$ 8,00`,
          deposito: `Depósito via Pix, geralmente creditado em segundos. Bônus na primeira recarga do dia.`,
          saque: `Saques via Pix com boa velocidade de processamento. Em caso de atraso, abra o suporte com o comprovante.`,
          jogos: `Foco em jogos online e slots (Fortune Tiger e outros). Também atende modalidades tradicionais de bancas.`,
          suporte: `Suporte eficiente dentro da plataforma. Atendimento em português.`,
          problemas: `Problemas técnicos: limpe cache, use Chrome atualizado. Problemas de saldo: abra chamado com print do Pix e horário da transação.`
        }
      }
    };

    // ============================================
    // ESTADO
    // ============================================
    let state = 'asking_platform';
    let pendingPlatform = null;
    let currentPlatform = null;
    let isTyping = false;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // ============================================
    // TEMAS
    // ============================================
    function applyTheme(themeName) {
      document.body.className = '';
      if (themeName) {
        document.body.classList.add('theme-' + themeName);
      }
    }

    function updateHeader(platformKey) {
      const p = knowledgeBase[platformKey];
      if (p) {
        document.getElementById('headerTitle').textContent = p.name + ' • Suporte';
        document.getElementById('headerStatus').textContent = 'Online • ' + p.name;
      }
    }

    // ============================================
    // UTILITÁRIOS
    // ============================================
    function normalize(str) {
      return str.toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getTime() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function createMessage(text, isBot = true, extraHTML = '') {
      const div = document.createElement('div');
      div.className = `message ${isBot ? 'bot' : 'user'}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = isBot ? '🤖' : '👤';

      const content = document.createElement('div');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = formatText(text) + extraHTML;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = getTime();

      content.appendChild(bubble);
      content.appendChild(time);
      div.appendChild(avatar);
      div.appendChild(content);
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function showTyping() {
      if (isTyping) return;
      isTyping = true;
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function hideTyping() {
      isTyping = false;
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function botReply(text, delay = 700, extraHTML = '') {
      showTyping();
      return new Promise(resolve => {
        setTimeout(() => {
          hideTyping();
          createMessage(text, true, extraHTML);
          resolve();
        }, delay);
      });
    }

    function showTransferring(platformName) {
      return new Promise(resolve => {
        const div = document.createElement('div');
        div.className = 'transfer-msg';
        div.id = 'transferMsg';
        div.innerHTML = `🔄 Transferindo para o suporte do <strong>${platformName}</strong><span class="dots"><span>.</span><span>.</span><span>.</span></span>`;
        messagesEl.appendChild(div);
        scrollToBottom();
        setTimeout(() => {
          const el = document.getElementById('transferMsg');
          if (el) el.remove();
          resolve();
        }, 1800);
      });
    }

    // ============================================
    // DETECÇÃO
    // ============================================
    function detectPlatform(text) {
      const n = normalize(text);
      let best = null;
      let bestScore = 0;

      for (const [key, data] of Object.entries(knowledgeBase)) {
        for (const alias of data.aliases) {
          const a = normalize(alias);
          if (n === a) return key;
          if (n.includes(a)) {
            const score = a.length;
            if (score > bestScore) {
              bestScore = score;
              best = key;
            }
          }
        }
      }
      return best;
    }

    function detectIntent(text) {
      const n = normalize(text);
      const rules = [
        { intent: 'bonus',    patterns: [/bonus/, /promo/, /promocao/, /oferta/, /recarga.*bonus/] },
        { intent: 'cotacao',  patterns: [/cotacao/, /milhar/, /centena/, /dezena/, /grupo/, /paga quanto/, /quanto paga/, /premio/] },
        { intent: 'deposito', patterns: [/deposito/, /depositar/, /recarregar/, /pix/, /colocar dinheiro/, /carregar/] },
        { intent: 'saque',    patterns: [/saque/, /sacar/, /retirar/, /receber/, /pagamento/, /transferir/] },
        { intent: 'jogos',    patterns: [/jogo/, /jogar/, /slot/, /tigrinho/, /fortune/, /bicho/, /loteria/, /cassino/] },
        { intent: 'suporte',  patterns: [/suporte/, /atendimento/, /contato/, /falar/, /humano/, /ajuda/] },
        { intent: 'problemas',patterns: [/problema/, /erro/, /bug/, /nao abre/, /travando/, /lento/, /nao caiu/, /nao credit/, /nao funciona/, /travou/, /nao consigo/] },
        { intent: 'geral',    patterns: [/geral/, /sobre/, /o que e/, /como funciona/, /informacao/] }
      ];
      for (const rule of rules) {
        for (const p of rule.patterns) {
          if (p.test(n)) return rule.intent;
        }
      }
      return 'geral';
    }

    function isConfirmation(text) {
      const n = normalize(text);
      const yes = ['sim', 'isso', 'correto', 'certo', 'exato', 'confirmo', 'pode ser', 'ok', 'okay', 'yes', 'uhum', 'isso mesmo', 'e esse', 'esse', 'positivo'];
      return yes.some(w => n === w || n.startsWith(w + ' ') || n.includes(' ' + w));
    }

    function isDenial(text) {
      const n = normalize(text);
      const no = ['nao', 'errado', 'incorreto', 'outro', 'outra', 'negativo', 'no'];
      return no.some(w => n === w || n.startsWith(w + ' ') || n.includes(' ' + w));
    }

    // ============================================
    // FLUXO PRINCIPAL
    // ============================================
    async function processMessage(userText) {
      const text = userText.trim();
      if (!text) return;

      createMessage(text, false);
      inputEl.value = '';
      autoResize();

      if (state === 'asking_platform') {
        const detected = detectPlatform(text);
        if (detected) {
          pendingPlatform = detected;
          state = 'confirming';
          const p = knowledgeBase[detected];
          await botReply(
            `Entendi! Você está pedindo suporte para o **${p.name}** ${p.icon}.\n\nEstá correto?`,
            800,
            `<div class="quick-replies">
              <button class="quick-btn confirm" onclick="confirmPlatform(true)">✅ Sim, está correto</button>
              <button class="quick-btn deny" onclick="confirmPlatform(false)">❌ Não, é outro</button>
            </div>`
          );
        } else {
          await botReply(
            `Não consegui identificar o aplicativo com clareza.\n\nPode digitar novamente o nome? Exemplos: Acertos Club, Feiticeira, Tiger Club, SuperBancas, Banca Brasileira ou Super Acertos.`,
            900
          );
        }
        return;
      }

      if (state === 'confirming') {
        if (isConfirmation(text)) {
          await confirmPlatform(true);
        } else if (isDenial(text)) {
          await confirmPlatform(false);
        } else {
          const newDetected = detectPlatform(text);
          if (newDetected) {
            pendingPlatform = newDetected;
            const p = knowledgeBase[newDetected];
            await botReply(
              `Ok, então você quis dizer **${p.name}** ${p.icon}?\n\nConfirma?`,
              700,
              `<div class="quick-replies">
                <button class="quick-btn confirm" onclick="confirmPlatform(true)">✅ Sim</button>
                <button class="quick-btn deny" onclick="confirmPlatform(false)">❌ Não</button>
              </div>`
            );
          } else {
            await botReply(
              `Por favor, confirme se é o **${knowledgeBase[pendingPlatform].name}** respondendo **sim** ou **não**.`,
              600
            );
          }
        }
        return;
      }

      if (state === 'awaiting_question' || state === 'answering') {
        if (/trocar|outra plataforma|outro app|mudar|quero outro|outro aplicativo/.test(normalize(text))) {
          state = 'asking_platform';
          currentPlatform = null;
          pendingPlatform = null;
          applyTheme(null);
          document.getElementById('headerTitle').textContent = 'Suporte Inteligente';
          document.getElementById('headerStatus').textContent = 'Online • Atendimento inteligente';
          await botReply(`Sem problema! Qual aplicativo você deseja suporte agora?`, 600);
          return;
        }

        const intent = detectIntent(text);
        const platform = knowledgeBase[currentPlatform];
        const answer = platform.info[intent] || platform.info.geral;

        state = 'answering';
        await botReply(answer, 900);
        await botReply(
          `Posso ajudar com mais alguma dúvida sobre o **${platform.name}**?`,
          500,
          `<div class="quick-replies">
            <button class="quick-btn" onclick="quickAsk('bonus')">🎁 Bônus</button>
            <button class="quick-btn" onclick="quickAsk('cotacao')">💰 Cotação</button>
            <button class="quick-btn" onclick="quickAsk('deposito')">📥 Depósito</button>
            <button class="quick-btn" onclick="quickAsk('saque')">📤 Saque</button>
            <button class="quick-btn" onclick="quickAsk('jogos')">🎮 Jogos</button>
            <button class="quick-btn" onclick="quickAsk('problemas')">🛠️ Problemas</button>
            <button class="quick-btn" onclick="changePlatform()">🔄 Trocar app</button>
          </div>`
        );
      }
    }

    // ============================================
    // BOTÕES
    // ============================================
    window.confirmPlatform = async function(yes) {
      if (yes) {
        currentPlatform = pendingPlatform;
        pendingPlatform = null;
        const p = knowledgeBase[currentPlatform];

        createMessage('Sim, está correto', false);

        // Mostra "Transferindo..." e aplica tema
        await showTransferring(p.name);
        applyTheme(p.theme);
        updateHeader(currentPlatform);

        state = 'awaiting_question';
        await botReply(
          `Você foi transferido para o suporte do **${p.name}** ${p.icon}.\n\nQual é a sua dúvida? Pode perguntar sobre bônus, cotação, depósito, saque, jogos ou qualquer problema.`,
          600
        );
      } else {
        createMessage('Não, é outro', false);
        state = 'asking_platform';
        pendingPlatform = null;
        currentPlatform = null;
        applyTheme(null);
        await botReply(
          `Entendi, desculpe o equívoco.\n\nPode me dizer novamente o nome do aplicativo que você precisa de suporte?`,
          700
        );
      }
    };

    window.quickAsk = async function(intent) {
      const labels = {
        bonus: 'Quero saber sobre os bônus',
        cotacao: 'Qual é a cotação?',
        deposito: 'Como faço um depósito?',
        saque: 'Como faço um saque?',
        jogos: 'Quais jogos tem disponíveis?',
        problemas: 'Estou com um problema'
      };
      await processMessage(labels[intent] || intent);
    };

    window.changePlatform = async function() {
      createMessage('Quero trocar de aplicativo', false);
      state = 'asking_platform';
      currentPlatform = null;
      pendingPlatform = null;
      applyTheme(null);
      document.getElementById('headerTitle').textContent = 'Suporte Inteligente';
      document.getElementById('headerStatus').textContent = 'Online • Atendimento inteligente';
      await botReply(`Combinado! Qual aplicativo você deseja suporte agora?`, 600);
    };

    // ============================================
    // INPUT
    // ============================================
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    }
    inputEl.addEventListener('input', autoResize);

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isTyping) return;
      sendBtn.disabled = true;
      await processMessage(text);
      sendBtn.disabled = false;
      inputEl.focus();
    }

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    async function startChat() {
      state = 'asking_platform';
      currentPlatform = null;
      pendingPlatform = null;
      applyTheme(null);
      document.getElementById('headerTitle').textContent = 'Suporte Inteligente';
      document.getElementById('headerStatus').textContent = 'Online • Atendimento inteligente';
      await botReply(
        `Olá! 👋 Sou o **Assistente de Suporte Inteligente**.\n\nPara te atender da melhor forma, preciso saber:\n\n**Qual aplicativo ou banca você deseja suporte?**`,
        900
      );
    }

    function resetChat() {
      messagesEl.innerHTML = '';
      startChat();
    }

    setTimeout(() => inputEl.focus(), 300);
    startChat();
  </script>
</body>
</html>
