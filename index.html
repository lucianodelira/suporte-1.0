<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suporte Inteligente | Bancas & Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: #2d3a4f;
      --text: #e8eef7;
      --text-muted: #8b9bb4;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #22c55e;
      --danger: #ef4444;
      --bot-bubble: #1e293b;
      --user-bubble: #1d4ed8;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .header-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Chat Container */
    .chat-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }
    .messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Message Bubbles */
    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.bot .avatar {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
    }

    .message.user .avatar {
      background: var(--surface-2);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.55;
      position: relative;
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border-top-right-radius: 4px;
      color: #fff;
    }

    .bubble strong {
      color: #93c5fd;
    }

    .message.user .bubble strong {
      color: #bfdbfe;
    }

    .bubble ul, .bubble ol {
      margin: 8px 0 4px 18px;
    }

    .bubble li {
      margin-bottom: 4px;
    }

    .time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding-left: 4px;
    }

    .message.user .time {
      text-align: right;
      padding-right: 4px;
    }

    /* Quick Replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .quick-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .quick-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* Platform Cards */
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .platform-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      font-weight: 500;
    }

    .platform-card:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.15);
      transform: translateY(-2px);
    }

    .platform-card .icon {
      font-size: 24px;
      margin-bottom: 6px;
    }

    /* Typing Indicator */
    .typing {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Area */
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .input-wrapper {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
    }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
    }

    #userInput::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      background: var(--primary);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--primary-hover);
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Reset Button */
    .reset-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 10;
    }

    .reset-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .message {
        max-width: 92%;
      }
      .platform-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .header-info h1 {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

          cotacao: `As cotações da Feiticeira são competitivas no mercado de Jogo do Bicho e jogos online. Para valores exatos de milhar, centena e grupo, verifique diretamente na plataforma no momento da aposta.`,

        info: {
          geral: `O **Super Acertos** faz parte do ecossistema de bancas digitais focadas em Jogo do Bicho e jogos online, com ênfase em cotações atrativas e experiência mobile.`,
          bonus: `Consulte a área de promoções dentro da plataforma para bônus de boas-vindas e recargas. As condições (rollover e validade) são informadas no momento da ativação.`,

      tigerclub: {

    // ============================================
    // ESTADO DO CHAT
    // ============================================
    let currentPlatform = null;
    let isTyping = false;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // ============================================
    // FUNÇÕES AUXILIARES
    // ============================================
    function getTime() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      setTimeout(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }, 50);
    }

    function createMessage(text, isBot = true, extraHTML = '') {
      const div = document.createElement('div');
      div.className = `message ${isBot ? 'bot' : 'user'}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = isBot ? '🤖' : '👤';

      const content = document.createElement('div');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = formatText(text) + extraHTML;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = getTime();

      content.appendChild(bubble);
      content.appendChild(time);

      div.appendChild(avatar);
      div.appendChild(content);
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function showTyping() {
      if (isTyping) return;
      isTyping = true;
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function hideTyping() {
      isTyping = false;
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function botReply(text, delay = 600, extraHTML = '') {
      showTyping();
      return new Promise(resolve => {
        setTimeout(() => {
          hideTyping();
          createMessage(text, true, extraHTML);
          resolve();
        }, delay);
      });
    }

    // ============================================
    // LÓGICA DE RESPOSTA
    // ============================================
    function detectPlatform(text) {
      const lower = text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      for (const [key, data] of Object.entries(knowledgeBase)) {
        for (const alias of data.aliases) {
          if (lower.includes(alias.normalize('NFD').replace(/[\u0300-\u036f]/g, ''))) {
            return key;
          }
        }
      }
      return null;
    }

    function detectIntent(text) {
      const lower = text.toLowerCase();
      if (/b[oô]nus|promo|promoção|oferta|recarga/.test(lower)) return 'bonus';
      if (/cota[cç][aã]o|milhar|centena|dezena|grupo|paga quanto|quanto paga/.test(lower)) return 'cotacao';
      if (/dep[oó]sito|depositar|recarregar|pix|colocar dinheiro/.test(lower)) return 'deposito';
      if (/saque|sacar|retirar|receber|pagamento|pagar/.test(lower)) return 'saque';
      if (/jogo|jogar|slot|tigrinho|fortune|bicho|loteria|cassino/.test(lower)) return 'jogos';
      if (/suporte|atendimento|contato|falar|humano|ajuda/.test(lower)) return 'suporte';
      if (/problema|erro|bug|n[aã]o abre|travando|lento|n[aã]o caiu|n[aã]o credit/.test(lower)) return 'problemas';
      if (/geral|sobre|o que [eé]|como funciona|informa[cç][aã]o/.test(lower)) return 'geral';
      return 'geral';
    }

    async function processMessage(userText) {
      const text = userText.trim();
      if (!text) return;

      createMessage(text, false);
      inputEl.value = '';
      autoResize();

      // Detectar plataforma se ainda não escolhida
      if (!currentPlatform) {
        const detected = detectPlatform(text);
        if (detected) {
          currentPlatform = detected;
          const p = knowledgeBase[detected];
          await botReply(`Perfeito! Você selecionou o **${p.name}** ${p.icon}.\n\nComo posso te ajudar?`);
          await showQuickTopics();
          return;
        }

        // Tentar entender se é escolha por número ou nome
        const num = parseInt(text);
        const keys = Object.keys(knowledgeBase);
        if (num >= 1 && num <= keys.length) {
          currentPlatform = keys[num - 1];
          const p = knowledgeBase[currentPlatform];
          await botReply(`Ótimo! Suporte para **${p.name}** ${p.icon} ativado.\n\nO que você precisa?`);
          await showQuickTopics();
          return;
        }

        await botReply(`Ainda não identifiquei a plataforma. Por favor, escolha uma das opções abaixo ou digite o nome:`);
        await showPlatformButtons();
        return;
      }

      // Já tem plataforma → responder com base de conhecimento
      const intent = detectIntent(text);
      const platform = knowledgeBase[currentPlatform];
      const answer = platform.info[intent] || platform.info.geral;

      await botReply(answer);
      await botReply(`Posso te ajudar com mais alguma coisa sobre o **${platform.name}**?`, 400, createQuickTopicsHTML());
    }

    function createQuickTopicsHTML() {
      const topics = [
        { label: '🎁 Bônus', intent: 'bonus' },
        { label: '💰 Cotação', intent: 'cotacao' },
        { label: '📥 Depósito', intent: 'deposito' },
        { label: '📤 Saque', intent: 'saque' },
        { label: '🎮 Jogos', intent: 'jogos' },
        { label: '🛠️ Problemas', intent: 'problemas' },
        { label: '📞 Suporte', intent: 'suporte' }
      ];

      let html = '<div class="quick-replies">';
      topics.forEach(t => {
        html += `<button class="quick-btn" onclick="quickAsk('${t.intent}')">${t.label}</button>`;
      });
      html += `<button class="quick-btn" onclick="changePlatform()">🔄 Trocar plataforma</button>`;
      html += '</div>';
      return html;
    }

    async function showQuickTopics() {
      const lastBubble = messagesEl.querySelector('.message.bot:last-child .bubble');
      if (lastBubble) {
        lastBubble.insertAdjacentHTML('beforeend', createQuickTopicsHTML());
      }
      scrollToBottom();
    }

    function createPlatformButtonsHTML() {
      let html = '<div class="platform-grid">';
      Object.entries(knowledgeBase).forEach(([key, data], i) => {
        html += `
          <div class="platform-card" onclick="selectPlatform('${key}')">
            <div class="icon">${data.icon}</div>
            ${data.name}
          </div>`;
      });
      html += '</div>';
      return html;
    }

    async function showPlatformButtons() {
      const lastBubble = messagesEl.querySelector('.message.bot:last-child .bubble');
      if (lastBubble) {
        lastBubble.insertAdjacentHTML('beforeend', createPlatformButtonsHTML());
      }
      scrollToBottom();
    }

    // ============================================
    // AÇÕES DOS BOTÕES
    // ============================================
    window.selectPlatform = async function(key) {
      currentPlatform = key;
      const p = knowledgeBase[key];
      createMessage(p.name, false);
      await botReply(`Excelente escolha! Suporte do **${p.name}** ${p.icon} ativado.\n\nEm que posso ajudar você agora?`);
      await showQuickTopics();
    };

    window.quickAsk = async function(intent) {
      const labels = {
        bonus: 'Quero saber sobre bônus',
        cotacao: 'Qual a cotação?',
        deposito: 'Como faço depósito?',
        saque: 'Como sacar?',
        jogos: 'Quais jogos tem?',
        problemas: 'Estou com um problema',
        suporte: 'Preciso de suporte'
      };
      await processMessage(labels[intent] || intent);
    };

    window.changePlatform = async function() {
      currentPlatform = null;
      createMessage('Quero trocar de plataforma', false);
      await botReply('Sem problemas! Qual plataforma você deseja agora?');
      await showPlatformButtons();
    };

    // ============================================
    // INPUT
    // ============================================
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    }

    inputEl.addEventListener('input', autoResize);

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isTyping) return;
      sendBtn.disabled = true;
      await processMessage(text);
      sendBtn.disabled = false;
      inputEl.focus();
    }

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    async function startChat() {
      await botReply(`Olá! 👋 Sou o **Assistente de Suporte Inteligente**.\n\nEstou aqui para te ajudar com dúvidas sobre as principais bancas e aplicativos:\n\n• Acertos Club\n• Feiticeira Club\n• Super Acertos\n• Banca Brasileira\n• SuperBancas\n• Tiger Club\n\n**Qual plataforma você precisa de suporte?**`);
      await showPlatformButtons();
    }

    function resetChat() {
      currentPlatform = null;
      messagesEl.innerHTML = '';
      startChat();
    }

    // Inicia
    startChat();
  </script>
</body>
</html>
